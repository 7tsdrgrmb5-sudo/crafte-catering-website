<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Your CraftE Quote | CraftE Catering LLC</title>
  <link rel="icon" type="image/png" href="assets/gold_cc_monogram_catering_logo.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="quote-page-body">
  <main class="quote-page">
    <a class="quote-page-brand" href="index.html"><img src="assets/gold_cc_monogram_catering_logo.svg?v=2" alt="CraftE Catering LLC" /></a>
    <section class="client-quote-card" id="quoteCard">
      <p class="eyebrow">Your CraftE Proposal</p>
      <h1 id="quoteNumber">Loading your quote…</h1>
      <p id="quoteIntro" class="quote-intro"></p>
      <div id="quoteMeta" class="quote-meta"></div>
      <div id="quoteItems" class="quote-line-items"></div>
      <div class="quote-totals" id="quoteTotals"></div>
      <div class="quote-expiry" id="quoteExpiry"></div>
      <p class="quote-action-status" id="actionStatus" role="status"></p>
      <div class="quote-actions" id="quoteActions">
        <button class="btn btn-gold" id="acceptQuote" type="button">Accept & Reserve My Date</button>
        <button class="btn btn-ghost" id="declineQuote" type="button">Decline Quote</button>
      </div>
      <div id="declinePanel" class="decline-panel" hidden>
        <label>Optional — what made you decide not to move forward?
          <textarea id="declineReason" rows="3" placeholder="Price, date, plans changed, etc."></textarea>
        </label>
        <button class="btn btn-ghost" id="confirmDecline" type="button">Confirm Decline</button>
      </div>
      <p class="quote-fine-print">Accepting your quote takes you to Stripe's secure checkout for the 30% booking retainer. Your date is confirmed after the retainer is successfully paid.</p>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://ozjctdmdwoutsebkjcpn.supabase.co';
    const KEY = 'sb_publishable_tERnQU70mt-6imXPumOiUg_EDTYsQpH';
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const demoMode = params.get('demo') === '1';
    const money = cents => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);
    const status = document.getElementById('actionStatus');

    async function callFunction(name, payload) {
      const res = await fetch(SUPABASE_URL + '/functions/v1/' + name, {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':KEY},
        body:JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      return data;
    }

    async function loadQuote() {
      if (!token) throw new Error('This quote link is incomplete.');
      const result = await callFunction('get-quote', {token});
      const q = result.quote;
      const client = q.client || {};
      document.getElementById('quoteNumber').textContent = q.number;
      if (demoMode) {
        const demoBanner = document.createElement('div');
        demoBanner.style.cssText = 'margin:0 0 18px;padding:10px 12px;border-radius:10px;background:#d4af37;color:#050505;font-weight:800;text-align:center';
        demoBanner.textContent = 'DEMO MODE — NO CARD WILL BE CHARGED';
        document.getElementById('quoteCard').prepend(demoBanner);
        document.getElementById('acceptQuote').textContent = 'Demo: Accept & Continue';
      }
      document.getElementById('quoteIntro').textContent = 'Prepared for ' + [client.first_name,client.last_name].filter(Boolean).join(' ');
      document.getElementById('quoteMeta').innerHTML = [
        ['Event', client.event_type],
        ['Date', client.event_date ? new Date(client.event_date + 'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : ''],
        ['Location', [client.venue_name,client.venue_city,client.venue_state].filter(Boolean).join(' • ')],
        ['Guests', client.guest_count],
        ['Package', client.package_interest ? client.package_interest[0].toUpperCase()+client.package_interest.slice(1) : '']
      ].filter(x=>x[1]).map(x=>'<div><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');

      document.getElementById('quoteItems').innerHTML = q.items.map(item => {
        const negative = item.line_total_cents < 0;
        return '<div class="quote-line"><span>'+item.description+'</span><strong class="'+(negative?'credit':'')+'">'+money(item.line_total_cents)+'</strong></div>';
      }).join('');

      document.getElementById('quoteTotals').innerHTML =
        '<div><span>Event Total</span><strong>'+money(q.total_cents)+'</strong></div>' +
        '<div class="retainer-row"><span>30% Retainer Due Today</span><strong>'+money(q.retainer_cents)+'</strong></div>' +
        '<div><span>Remaining Balance</span><strong>'+money(q.balance_cents)+'</strong></div>';

      document.getElementById('quoteExpiry').textContent = q.expires_at ? 'Quote valid until ' + new Date(q.expires_at).toLocaleString() : '';

      const actions = document.getElementById('quoteActions');
      if (q.status === 'declined') {
        actions.hidden = true;
        status.textContent = 'You declined this quote. You can request a new one anytime.';
      } else if (q.status === 'expired') {
        actions.hidden = true;
        status.textContent = 'This quote has expired. Please request a new quote.';
      } else if (result.booking?.status === 'booked') {
        actions.hidden = true;
        status.textContent = '✓ Your retainer is paid and your event is booked.';
      }
    }

    document.getElementById('acceptQuote').addEventListener('click', async () => {
      const button = document.getElementById('acceptQuote');
      button.disabled = true;
      button.textContent = 'Opening Secure Checkout…';
      status.textContent = '';
      try {
        if (demoMode) {
          location.href = 'demo-checkout.html?token=' + encodeURIComponent(token);
          return;
        }
        const result = await callFunction('quote-action', {token,action:'accept'});
        if (result.already_paid) {
          location.href = 'booking-success.html?token=' + encodeURIComponent(token);
          return;
        }
        if (!result.checkout_url) throw new Error('Secure checkout is not available yet.');
        location.href = result.checkout_url;
      } catch (e) {
        status.textContent = e.message;
        button.disabled = false;
        button.textContent = 'Accept & Reserve My Date';
      }
    });

    document.getElementById('declineQuote').addEventListener('click', () => {
      document.getElementById('declinePanel').hidden = false;
    });

    document.getElementById('confirmDecline').addEventListener('click', async () => {
      try {
        await callFunction('quote-action', {token,action:'decline',reason:document.getElementById('declineReason').value});
        document.getElementById('quoteActions').hidden = true;
        document.getElementById('declinePanel').hidden = true;
        status.textContent = 'Quote declined. Thank you for considering CraftE Catering.';
      } catch (e) { status.textContent = e.message; }
    });

    loadQuote().catch(e => {
      document.getElementById('quoteNumber').textContent = 'Unable to load quote';
      status.textContent = e.message;
      document.getElementById('quoteActions').hidden = true;
    });
  </script>
  <script src="analytics.js?v=2"></script>\n</body>
</html>
