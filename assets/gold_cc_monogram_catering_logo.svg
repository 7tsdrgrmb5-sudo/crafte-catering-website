  <g transform="translate(574 166)" stroke="url(#gold)" fill="none" stroke-width="6" stroke-linejoin="round">
    <path d="M0 8h82l-41 44z"/>
    <path d="M41 52v52"/>
    <path d="M20 104h42"/>
    <circle cx="68" cy="-2" r="7" fill="url(#gold)" stroke="none"/>
    <path d="M64 -7l17-24"/>
    <circle cx="83" cy="-34" r="4" fill="url(#gold)" stroke="none"/>
  </g>
  <text x="668" y="244" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="300" letter-spacing="-4">ering</text>
  <text x="910" y="282" fill="#e9c66f" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="7">EST. 2023</text>
  <line x1="332" y1="292" x2="868" y2="292" stroke="url(#gold)" stroke-width="2"/>
