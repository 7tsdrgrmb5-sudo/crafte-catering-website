<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">CraftE Catering LLC</title>
<desc id="desc">Wide metallic gold CraftE Catering logo with interlocking CC monogram, martini detail, establishment year and tagline.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7f4e12"/>
    <stop offset=".18" stop-color="#d89931"/>
    <stop offset=".39" stop-color="#ffe08a"/>
    <stop offset=".52" stop-color="#fff0b5"/>
    <stop offset=".68" stop-color="#d2932f"/>
    <stop offset=".86" stop-color="#ffd56d"/>
    <stop offset="1" stop-color="#8b5718"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#glow)">
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round">
    <path d="M548 38c-65-35-151 12-151 88s86 123 151 88"/>
    <path d="M622 38c-65-35-151 12-151 88s86 123 151 88"/>
